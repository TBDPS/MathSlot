[package]
name = "mathslot-render"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Headless render pipeline contract: MathRenderer trait, deterministic cache, generation cancellation, explicit degradation, error summaries, and viewport fit geometry"

[features]
default = ["latex-rust-backend"]
latex-rust-backend = ["dep:latex-rust"]

[dependencies]
latex-rust = { version = "3.0.3", optional = true }
mathslot-syntax = { path = "../mathslot-syntax" }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
