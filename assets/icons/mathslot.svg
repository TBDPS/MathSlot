<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0A0F1D"/>
    </linearGradient>

    <!-- Subtle Radial Top Highlight -->
    <radialGradient id="topGlow" cx="45%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>

    <!-- Border Ring Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Gold Gradient for Integral -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="35%" stop-color="#F59E0B"/>
      <stop offset="85%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Cyan Glow for Slot & Cursor -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Rounded Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="108" ry="108" fill="url(#bgGrad)" filter="url(#shadow)"/>
  <rect x="24" y="24" width="464" height="464" rx="108" ry="108" fill="url(#topGlow)"/>
  <rect x="24" y="24" width="464" height="464" rx="108" ry="108" fill="none" stroke="url(#borderGrad)" stroke-width="4.5"/>

  <!-- Subtle Blueprint Math Grid Lines -->
  <g opacity="0.08" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="6,6">
    <line x1="80" y1="170" x2="432" y2="170"/>
    <line x1="80" y1="256" x2="432" y2="256"/>
    <line x1="80" y1="342" x2="432" y2="342"/>
    <line x1="200" y1="90" x2="200" y2="422"/>
    <line x1="330" y1="90" x2="330" y2="422"/>
  </g>

  <!-- Golden Integral Symbol ∫ -->
  <!-- Handcrafted master curves for high legibility at 16x16 to 512x512 -->
  <path d="M 226 122 
           C 226 102, 206 94, 182 94 
           C 142 94, 126 122, 126 150 
           C 126 166, 136 178, 150 178 
           C 166 178, 178 166, 178 152 
           C 178 142, 172 134, 164 130 
           C 170 120, 180 118, 188 118 
           C 198 118, 204 124, 204 138 
           C 204 154, 196 182, 184 234 
           L 174 278 
           C 160 338, 150 376, 150 400 
           C 150 422, 168 430, 192 430 
           C 234 430, 252 402, 252 374 
           C 252 358, 240 346, 226 346 
           C 212 346, 200 358, 200 372 
           C 200 382, 206 390, 214 394 
           C 206 404, 198 406, 188 406 
           C 176 406, 172 398, 172 384 
           C 172 366, 182 334, 194 284 
           L 204 240 
           C 218 180, 226 142, 226 122 Z"
        fill="url(#goldGrad)"
        filter="url(#shadow)"/>

  <!-- Upper Limit Slot Ring (Golden Accent) -->
  <circle cx="236" cy="112" r="10" fill="#FDE68A" filter="url(#glow)"/>
  <circle cx="236" cy="112" r="5" fill="#B45309"/>

  <!-- Lower Limit Slot Ring (Golden Accent) -->
  <circle cx="140" cy="410" r="10" fill="#FDE68A" filter="url(#glow)"/>
  <circle cx="140" cy="410" r="5" fill="#B45309"/>

  <!-- Interactive Slot Card (Cyan Brackets / Slot Box) -->
  <g transform="translate(262, 188)">
    <!-- Slot Backdrop with Soft Glow -->
    <rect x="0" y="0" width="164" height="136" rx="22" 
          fill="#0F243E" fill-opacity="0.85"
          stroke="url(#cyanGrad)" stroke-width="3"
          stroke-dasharray="12,6"
          filter="url(#glow)"/>

    <!-- Left Bracket Marker [ -->
    <path d="M 28 28 L 16 28 L 16 108 L 28 108" 
          fill="none" stroke="#38BDF8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Right Bracket Marker ] -->
    <path d="M 136 28 L 148 28 L 148 108 L 136 108" 
          fill="none" stroke="#38BDF8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Flashing/Active Slot Cursor (MathSlot Core Identity) -->
    <rect x="76" y="36" width="12" height="64" rx="6" fill="#38BDF8" filter="url(#glow)"/>
    <rect x="78" y="38" width="8" height="60" rx="4" fill="#FFFFFF"/>

    <!-- Slot Floor Indicator '_' -->
    <line x1="50" y1="108" x2="114" y2="108" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Small Elegant Differential Notation 'dt' Badge -->
  <g transform="translate(362, 350)" opacity="0.9">
    <text x="0" y="24" font-family="DejaVu Sans, Inter, system-ui, sans-serif" font-weight="700" font-size="28" fill="#94A3B8" letter-spacing="1">
      d<tspan fill="#F59E0B">x</tspan>
    </text>
  </g>
</svg>
