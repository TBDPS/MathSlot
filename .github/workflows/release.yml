name: Cross-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.0.0; defaults to v<package.json version>)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Tests & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run core tests and typechecks
        run: |
          npm run test
          npm run check --workspace=@mathslot/obsidian

  build-obsidian:
    name: Build Obsidian Plugin
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Obsidian plugin
        run: npm run build:obsidian

      - name: Package Obsidian release assets
        run: |
          VERSION=$(node -p "require('./apps/obsidian/manifest.json').version")
          mkdir -p out
          cp apps/obsidian/dist/main.js apps/obsidian/dist/styles.css apps/obsidian/dist/manifest.json out/
          (cd apps/obsidian/dist && zip -r "${GITHUB_WORKSPACE}/out/mathslot-obsidian-${VERSION}.zip" main.js styles.css manifest.json)
          ls -lh out/

      - name: Upload Obsidian artifacts
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-plugin
          path: out/*

  build-linux:
    name: Build Desktop (Linux x86_64)
    needs: verify
    runs-on: ubuntu-22.04
    env:
      NO_STRIP: true
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri v2 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Build Linux bundles (.deb, .rpm, .AppImage)
        working-directory: apps/desktop
        run: npx tauri build --bundles deb,rpm,appimage

      - name: Collect Linux bundles
        run: |
          mkdir -p out
          cp apps/desktop/src-tauri/target/release/bundle/deb/*.deb out/
          cp apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm out/
          cp apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage out/
          ls -lh out/

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-x86_64
          path: out/*

  build-windows:
    name: Build Desktop (Windows x86_64)
    needs: verify
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Build Windows bundles (.exe NSIS, .msi)
        working-directory: apps/desktop
        run: npx tauri build --bundles nsis,msi

      - name: Collect Windows bundles
        shell: bash
        run: |
          mkdir -p out
          cp apps/desktop/src-tauri/target/release/bundle/nsis/*.exe out/
          cp apps/desktop/src-tauri/target/release/bundle/msi/*.msi out/
          ls -lh out/

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x86_64
          path: out/*

  build-macos:
    name: Build Desktop (macOS Apple Silicon)
    needs: verify
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Build macOS bundle (.dmg)
        working-directory: apps/desktop
        run: npx tauri build --bundles dmg

      - name: Collect macOS bundles
        run: |
          mkdir -p out
          cp apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg out/
          ls -lh out/

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-aarch64
          path: out/*

  publish-release:
    name: Publish GitHub Release
    needs:
      - build-obsidian
      - build-linux
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [[ -n "${{ github.event.inputs.tag }}" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="v$(node -p "require('./package.json').version")"
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "Resolved release tag: ${TAG}"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Assemble release assets and SHA256 checksums
        run: |
          mkdir -p release-assets
          find dist -type f -exec mv -v {} release-assets/ \;
          (cd release-assets && sha256sum * > SHA256SUMS.txt)
          ls -lh release-assets/
          cat release-assets/SHA256SUMS.txt

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: MathSlot ${{ steps.meta.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-assets/*
          body: |
            ### MathSlot ${{ steps.meta.outputs.tag }} 跨平台正式发布

            所见即所得的键盘流数学公式编辑器（Tauri v2 桌面端 + 零 WASM Obsidian 插件）。

            #### 下载说明 (Release Assets)
            - **Linux (x86_64)**：提供 `.rpm`（Fedora / RHEL）、`.deb`（Ubuntu / Debian）、`.AppImage`（通用便携版）
            - **Windows (x86_64)**：提供 `.exe`（NSIS 安装包）与 `.msi` 安装包
            - **macOS (Apple Silicon)**：提供 `.dmg` 安装镜像
            - **Obsidian 插件**：下载 `mathslot-obsidian-*.zip` 解压至 `<Vault>/.obsidian/plugins/obsidian-mathslot/`（同时附带散装 `main.js` / `styles.css` / `manifest.json` 供 BRAT / 插件更新器直接拉取）
            - **校验文件**：`SHA256SUMS.txt`
