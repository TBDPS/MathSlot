# Note: Green CI belongs to G0 exit conditions, not T0.1 exit. Failure during early G0 is expected until T0.2.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: CI Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-dev \
            libx11-xcb-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            librsvg2-dev

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies (packages/ui & apps/desktop)
        run: |
          npm ci --prefix packages/ui
          npm ci --prefix apps/desktop

      - name: Build shared UI and desktop frontend assets
        run: |
          npm run build --prefix packages/ui
          npm run build --prefix apps/desktop

      - name: Install wasm-bindgen-cli 0.2.130
        run: |
          if [ "$(wasm-bindgen --version 2>/dev/null || true)" != "wasm-bindgen 0.2.130" ]; then
            cargo install --locked wasm-bindgen-cli --version 0.2.130
          fi

      - name: Check code formatting
        run: cargo fmt --check

      - name: Workspace clippy lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Check generated artifacts
        run: cargo run -p xtask -- check

      - name: Test, typecheck, and build shared UI (packages/ui)
        run: |
          cd packages/ui
          npm test
          npm run check
          npm run build

      - name: Test, typecheck, build, and E2E test Desktop shell (apps/desktop)
        run: |
          cd apps/desktop
          npm test
          npm run check
          npm run build
          npx playwright install chromium
          npm run test:e2e

      - name: Build, smoke-test, and verify freshness of Obsidian plugin
        run: |
          node obsidian-mathslot/scripts/build.mjs
          git diff --exit-code -- obsidian-mathslot/

      - name: Run offline Rust benchmarks and JS/WASM performance budgets (T4.3 / §13.5)
        run: |
          cargo bench --workspace --offline
          node packages/ui/scripts/bench-budgets.mjs

      - name: Test, typecheck, and E2E test Obsidian shell (apps/obsidian)
        run: |
          cd apps/obsidian
          npm test
          npm run check
          npm run test:e2e
