name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-ts:
    name: Core Tests, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run @mathslot/core unit tests
        run: npm run test --workspace=@mathslot/core

      - name: Run svelte-check (@mathslot/ui & @mathslot/desktop)
        run: npm run check --workspace=@mathslot/ui && npm run check --workspace=@mathslot/desktop

      - name: Run Obsidian plugin typecheck
        run: npm run check --workspace=@mathslot/obsidian

      - name: Build Desktop frontend & Obsidian plugin
        run: npm run build

  verify-rust:
    name: Tauri Rust Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Run cargo check & cargo test
        run: |
          cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
