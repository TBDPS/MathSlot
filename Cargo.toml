[workspace]
members = [
    "crates/mathslot-syntax",
    "crates/mathslot-doc",
    "crates/mathslot-latex",
    "crates/mathslot-core",
]
resolver = "2"

[workspace.package]
version = "0.6.0"
edition = "2024"
authors = ["MathSlot Authors"]
license = "MIT OR Apache-2.0"

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
strip = "symbols"
