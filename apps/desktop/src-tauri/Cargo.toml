[package]
name = "mathslot-desktop"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Tauri 2 desktop application shell for MathSlot"

[lib]
name = "mathslot_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = "3"
mathslot-app = { path = "../../../crates/mathslot-app" }
mathslot-command = { path = "../../../crates/mathslot-command" }
mathslot-core = { path = "../../../crates/mathslot-core" }
mathslot-render = { path = "../../../crates/mathslot-render" }
mathslot-store = { path = "../../../crates/mathslot-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = "2"
