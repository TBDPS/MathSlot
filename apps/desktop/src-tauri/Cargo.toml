[package]
name = "mathslot"
version = "2.0.1"
description = "Visual-first keyboard-flow math formula editor"
authors = ["MathSlot Authors"]
license = "MIT OR Apache-2.0"
edition = "2021"

[lib]
name = "mathslot_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[profile.release]
lto = "thin"
strip = "symbols"
